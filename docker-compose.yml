services:
  db:
    image: postgres:16-alpine
    profiles: ['local']
    environment:
      POSTGRES_DB: declic
      POSTGRES_USER: declic
      POSTGRES_PASSWORD: declic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      PORT: 8000
    ports:
      - '8000:8000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
    depends_on:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres_data:
